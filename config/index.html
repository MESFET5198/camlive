<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>USB Camera Live</title>
<style>
  html,body{margin:0;height:100%;background:#111;display:flex;flex-direction:column;align-items:center;font-family:sans-serif}
  h2{color:#ddd;font-weight:400;margin:10px}
  video{width:100%;max-height:76vh;background:#000;border-radius:6px;display:block}
  .err{display:none;color:#f66;font-size:12px;margin:6px 0}
  .cams{display:flex;gap:14px;width:98vw;justify-content:center;flex-wrap:wrap}
  .cam{position:relative;flex:1 1 46%;min-width:340px;background:#18181b;border:1px solid #333;border-radius:8px;padding:10px;box-sizing:border-box}
  .cam h3{color:#ddd;font-weight:400;margin:0 0 8px;font-size:14px;display:flex;justify-content:space-between;align-items:center}
  .cam h3 .st{color:#6f6;font-size:12px;font-weight:400}
  .cam h3 .st.off{color:#f66}
  .cam h3 .btns{margin-left:auto;display:flex;gap:6px}
  .cam h3 .btns button{font-size:12px;padding:3px 10px}
  .cam:fullscreen{flex:1 1 100%;width:100%;background:#111;overflow:auto}
  .cam:fullscreen video{max-height:calc(100vh - 190px)}
  body.single .cam{display:none}
  body.single .cam.show{display:block;flex:1 1 100%;min-width:0}
  body.single .cam.show video{max-height:calc(100vh - 190px)}
  #backbtn{display:none;position:fixed;top:10px;right:14px;z-index:99}
  .cfgrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:#222;border:1px solid #333;border-radius:6px;padding:8px 10px;margin:8px 0}
  .cfgrow label{color:#aaa;font-size:12px}
  .ptzrow{display:flex;gap:8px;align-items:center;background:#222;border:1px solid #333;border-radius:6px;padding:8px 10px;margin:8px 0;flex-wrap:wrap}
  .ptzrow .st{color:#6f6;font-size:11px;margin-left:auto}
  .ctrlrow{display:flex;flex-wrap:wrap;gap:10px;background:#222;border:1px solid #333;border-radius:6px;padding:8px 10px;margin:8px 0}
  .grp{border-left:2px solid #444;padding-left:10px;display:flex;flex-direction:column;gap:4px}
  .grp .gt{color:#999;font-size:11px}
  .grp label{color:#aaa;font-size:12px;display:flex;align-items:center;gap:6px}
  .grp input[type=range]{width:110px}
  .printer{margin-top:8px;background:#222;border:1px solid #333;border-radius:6px;padding:8px 12px;display:none;font-size:12px}
  .vtime{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);z-index:6;background:rgba(0,0,0,.45);color:#eee;font:12px/1.4 monospace;padding:2px 8px;border-radius:3px;pointer-events:none;display:none}
  .printer .pline{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .printer .pst{font-weight:bold}
  .printer .pst.printing{color:#0f0}
  .printer .pst.paused{color:#fa0}
  .printer .pst.complete{color:#0af}
  .printer .pname{color:#aaa;word-break:break-all;flex:1;min-width:120px}
  .printer .pp{color:#fff;font-weight:bold;min-width:52px;text-align:right}
  .printer .pbar{height:5px;background:#333;border-radius:3px;margin-top:6px;overflow:hidden}
  .printer .pcmd{font-size:11px;padding:2px 10px;border-radius:4px;cursor:pointer;border:0}
  .printer .pcmd.pause{background:#fa0;color:#111}
  .printer .pcmd.resume{background:#0a7dff;color:#fff}
  .printer .pbar i{display:block;height:100%;background:#0a7dff;width:0%}
  .grp .v{color:#eee;font-size:11px;min-width:34px}
  select,input,button{background:#2a2a2e;color:#eee;border:1px solid #444;border-radius:4px;padding:5px 8px;font-size:13px}
  button{background:#0a7dff;color:#fff;border:0;cursor:pointer}
  button:disabled{opacity:.5}
</style>
</head>
<body>
<h2>USB Camera Live</h2>
<button id="backbtn">返回全部画面</button>
<div class="cams" id="cams"></div>
<script src="hls.js"></script>
<script>
var PLAYERS = {};
function play(id, card) {
  var v = card.querySelector("video");
  var e = card.querySelector(".err");
  var src = id + ".m3u8";
  var key = "_hls_" + id;
  var retryTimer = null, healthTimer = null, lastPos = 0, lastProgress = Date.now(), hasPlayed = false;
  function restart(reason) {
    if (retryTimer) return;
    e.textContent = "视频恢复中...（" + reason + "）";
    e.style.display = "block";
    if (window[key]) { try { window[key].destroy(); } catch(x){} window[key] = null; }
    retryTimer = setTimeout(function(){ retryTimer = null; start(); }, 1200);
  }
  function start() {
    if (Hls.isSupported()) {
      if (window[key]) { try { window[key].destroy(); } catch(x){} }
      var hls = new Hls({liveSyncDurationCount: 3, maxBufferLength: 10, maxMaxBufferLength: 20, backBufferLength: 14, liveDurationInfinity: true, fragLoadingMaxRetry: 8, manifestLoadingMaxRetry: 8, levelLoadingMaxRetry: 8, fragLoadingTimeOut: 6000});
      window[key] = hls;
      var parsed = false;
      hls.loadSource(src + "?t=" + Date.now());
      hls.attachMedia(v);
      hls.on(Hls.Events.MANIFEST_PARSED, function(){ parsed = true; v.play().catch(function(){}); e.style.display="none"; lastProgress = Date.now(); });
      hls.on(Hls.Events.ERROR, function(ev,d){
        if (d.fatal) { restart("HLS错误"); }
        else { e.style.display="none"; }
      });
      var resumeTimer = null, loadTimer = setTimeout(function(){ if (!parsed) restart("加载超时"); }, 15000);
      v.addEventListener("pause", function(){
        if (resumeTimer || v.ended) return;
        resumeTimer = setTimeout(function(){
          resumeTimer = null;
          if (v.paused && window[key]) {
            v.play().catch(function(){ restart("播放暂停"); });
          }
        }, 1500);
      });
      v.addEventListener("timeupdate", function(){
        if (v.currentTime !== lastPos) {
          lastPos = v.currentTime; lastProgress = Date.now();
          e.style.display = "none";
        }
      });
      v.addEventListener("playing", function(){
        hasPlayed = true;
        lastProgress = Date.now();
        e.style.display = "none";
      });
      clearInterval(healthTimer);
      healthTimer = setInterval(function(){
        if (window[key] && parsed && hasPlayed && !v.paused && Date.now() - lastProgress > 6000) {
          restart("画面未推进");
        }
      }, 2000);
      v.addEventListener("play", function(){
        if (resumeTimer) { clearTimeout(resumeTimer); resumeTimer = null; }
      });
    } else if (v.canPlayType("application/vnd.apple.mpegurl")) { v.src = src; }
  }
  start();
  return {start: start, card: card};
}
function post(url, body) {
  return fetch(url, {method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify(body)}).then(r=>r.json());
}
function esc(s) {
  return String(s).replace(/[&<>"]/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];
  });
}
function buildCard(cam) {
  var d = document.createElement("div");
  d.className = "cam";
  d.id = "cam_" + cam.id;
  d.innerHTML =
    '<h3><span>' + esc(cam.name) + '</span><span class="btns">' +
      '<button class="btnwake" style="display:none" title="唤醒推流">&#9654; 唤醒</button>' +
      '<button class="btnsets" title="展开/收起设置(防误触)">&#9881; 设置</button>' +
      '<button class="btnsolo" title="只看此画面">单画面</button>' +
      '<button class="btnfs" title="网页全屏">&#10530; 全屏</button>' +
      '<span class="st">--</span></span></h3>' +
    '<div class="cfgrow" style="display:none">' +
      '<label>模式 <select class="selmode">' +
        '<option value="h264">H.264 流畅</option>' +
        '<option value="mjpeg">MJPEG 实时</option></select></label>' +
      '<label>分辨率 <select class="selres"></select></label>' +
      '<label>帧率 <select class="selfps"></select></label>' +
      '<label>码率 <select class="selbr">' +
        '<option value="1M">1 Mbps</option><option value="2M">2 Mbps</option>' +
        '<option value="4M" selected>4 Mbps</option><option value="8M">8 Mbps</option>' +
        '<option value="12M">12 Mbps</option></select></label>' +
      '<button class="btnapply">应用</button></div>' +
    '<div class="ptzrow" style="display:none">' +
      '<span style="color:#999;font-size:12px">云台</span>' +
      '<button class="p0" data-p="0" data-t="20000">&#9650;</button>' +
      '<button class="p-20000" data-p="-20000" data-t="0">&#9664;</button>' +
      '<button class="pcenter">&#9678;</button>' +
      '<button class="p20000" data-p="20000" data-t="0">&#9654;</button>' +
      '<button class="p-0" data-p="0" data-t="-20000">&#9660;</button>' +
      '<label>变焦 <input type="range" class="zrange" min="100" max="400" step="10" value="100" style="width:110px;vertical-align:middle"> <span class="zv">1.0x</span></label>' +
      '<span class="st">--</span></div>' +
    '<div class="ctrlrow"></div>' +
    '<div class="vtime"></div>' +
    '<div class="err">视频加载中...（若长时间无画面请检查摄像头）</div>' +
    '<video autoplay muted playsinline controls></video>' +
    '<img class="preview" style="display:none;width:100%;max-height:76vh;background:#000;border-radius:6px"></img>' +
    '<div class="printer"><div class="pline"><span class="pst"></span><span class="pname"></span><span class="pp"></span><button class="pcmd pause">暂停</button><button class="pcmd resume" style="display:none">继续</button></div><div class="pbar"><i></i></div></div>';
  document.getElementById("cams").appendChild(d);
  return d;
}
var GROUPS = [
  {key:"focus", title:"对焦", auto:"focus_automatic_continuous", items:["focus_absolute"]},
  {key:"wb", title:"白平衡", auto:"white_balance_automatic", items:["white_balance_temperature"]},
  {key:"exposure", title:"曝光", auto:"auto_exposure", items:["exposure_time_absolute"]},
  {key:"image", title:"图像", items:["brightness","contrast","saturation","hue","sharpness"]},
];
function buildControls(id, card, data) {
  var row = card.querySelector(".ctrlrow");
  row.innerHTML = "";
  GROUPS.forEach(function(g){
    var names = g.items.filter(function(n){ return data.controls[n]; });
    var auto = g.auto ? data.controls[g.auto] : null;
    if (!names.length && !auto) return;
    var grp = document.createElement("div");
    grp.className = "grp";
    grp.innerHTML = '<span class="gt">' + esc(g.title) + '</span>';
    if (auto) {
      var cb = document.createElement("label");
      cb.innerHTML = '<input type="checkbox" class="auto"> ' + esc(g.auto);
      cb.querySelector("input").checked = auto.value == 1;
      cb.querySelector("input").onchange = function(){
        post("api/cam/" + id + "/control", {ctrl: g.auto, value: this.checked ? 1 : 0});
        names.forEach(function(n){
          var sl = grp.querySelector('input[data-ctrl="' + n + '"]');
          if (sl) sl.disabled = this.checked;
        }, this);
      };
      grp.appendChild(cb);
    }
    names.forEach(function(n){
      var c = data.controls[n];
      var lab = document.createElement("label");
      lab.innerHTML = esc(n) + ' <input type="range" data-ctrl="' + esc(n) + '" min="' + c.min +
        '" max="' + c.max + '" step="' + (c.step||1) + '" value="' + c.value + '">' +
        '<span class="v">' + c.value + '</span>';
      var sl = lab.querySelector("input");
      if (auto && auto.value == 1) sl.disabled = true;
      sl.oninput = function(){ lab.querySelector(".v").textContent = this.value; };
      sl.onchange = function(){ post("api/cam/" + id + "/control", {ctrl: n, value: parseInt(this.value)}); };
      grp.appendChild(lab);
    }, this);
    row.appendChild(grp);
  });
  if (!row.children.length) row.style.display = "none";
}
function showMjpeg(id, card) {
  card.querySelector("video").style.display = "none";
  var img = card.querySelector(".preview");
  img.style.display = "block";
  img.src = "preview/" + id + "/stream?t=" + Date.now();
  img.onerror = function(){ var self = this; setTimeout(function(){ self.src = "preview/" + id + "/stream?t=" + Date.now(); }, 2000); };
}
function showH264(id, card) {
  var img = card.querySelector(".preview");
  img.style.display = "none";
  img.onerror = null;
  card.querySelector("video").style.display = "block";
}
function buildConfig(id, card, data) {
  if (!data.formats || !data.formats.length) return;
  var row = card.querySelector(".cfgrow");
  row.style.display = "flex";
  row.querySelector(".selmode").value = data.mode || "h264";
  row.querySelector(".selmode").onchange = function(){
    var mode = this.value, btn = this;
    btn.disabled = true;
    post("api/cam/" + id + "/mode", {mode: mode}).then(function(d){
      if (d.ok) {
        if (mode === "mjpeg") { showMjpeg(id, card); card.querySelector(".err").style.display = "none"; }
        else {
          showH264(id, card);
          setTimeout(function(){ PLAYERS[id].start(); }, 3000);
        }
      } else alert("切换失败: " + (d.error||"未知"));
    }).catch(function(e){ alert("请求失败: " + e); })
    .finally(function(){ btn.disabled = false; });
  };
  var resSel = row.querySelector(".selres"), fpsSel = row.querySelector(".selfps");
  var curW = data.width, curH = data.height, curFps = data.fps;
  var ress = [], seen = {};
  data.formats.forEach(function(f){
    var k = f.width + "x" + f.height;
    if (!seen[k]) { seen[k] = true; ress.push({w:f.width, h:f.height, label:k}); }
  });
  resSel.innerHTML = "";
  ress.forEach(function(r){
    var o = document.createElement("option");
    o.value = r.w + "x" + r.h;
    o.textContent = r.label;
    if (r.w == curW && r.h == curH) o.selected = true;
    resSel.appendChild(o);
  });
  function fillFps(){
    var r = resSel.value.split("x");
    var f = data.formats.filter(function(x){ return x.width==+r[0] && x.height==+r[1]; });
    fpsSel.innerHTML = "";
    f.forEach(function(x){
      var o = document.createElement("option");
      o.value = x.fps; o.textContent = x.fps + " fps";
      if (x.fps == curFps) o.selected = true;
      fpsSel.appendChild(o);
    });
  }
  resSel.onchange = fillFps;
  fillFps();
  row.querySelector(".btnapply").onclick = function(){
    var btn = this; btn.disabled = true;
    var r = resSel.value.split("x");
    post("api/cam/" + id + "/config", {width:+r[0], height:+r[1],
      fps:parseInt(fpsSel.value), bitrate:row.querySelector(".selbr").value})
    .then(function(d){
      if (d.ok) {
        var st = card.querySelector(".st");
        st.textContent = d.width + "x" + d.height + " @" + d.fps + "fps " + d.bitrate;
        setTimeout(function(){ PLAYERS[id].start(); refreshCam(id); }, 4000);
      } else alert("切换失败: " + (d.error||"未知"));
    }).catch(function(e){ alert("请求失败: " + e); })
    .finally(function(){ btn.disabled = false; });
  };
}
function buildPtz(id, card, data) {
  var row = card.querySelector(".ptzrow");
  row.style.display = "flex";
  if (!data.ptz) {
    row.querySelectorAll("button, .zrange").forEach(function(b){ b.disabled = true; });
    var st = row.querySelector(".st");
    st.textContent = "此摄像头不支持云台";
    st.style.color = "#f66";
    return;
  }
  var pan = data.ptz.pan_absolute, tilt = data.ptz.tilt_absolute;
  row.querySelectorAll("button[data-p]").forEach(function(b){
    b.onclick = function(){
      var cur = window["_ptz_" + id] || data.ptz;
      post("api/cam/" + id + "/ptz", {pan: cur.pan_absolute + parseInt(b.dataset.p),
        tilt: cur.tilt_absolute + parseInt(b.dataset.t)});
    };
  });
  row.querySelector(".pcenter").onclick = function(){ post("api/cam/" + id + "/ptz", {pan:0, tilt:0}); };
  var z = row.querySelector(".zrange");
  z.min = data.controls.zoom_absolute ? data.controls.zoom_absolute.min : 100;
  z.max = data.controls.zoom_absolute ? data.controls.zoom_absolute.max : 400;
  z.value = data.ptz.zoom_absolute;
  z.oninput = function(){ row.querySelector(".zv").textContent = (this.value/100).toFixed(1) + "x"; };
  z.onchange = function(){ post("api/cam/" + id + "/ptz", {zoom: parseInt(this.value)}); };
  row.querySelector(".st").textContent = "pan:" + pan + " tilt:" + tilt;
  window["_ptz_" + id] = data.ptz;
}
function setStatus(card, d) {
  var st = card.querySelector(".st");
  var wake = card.querySelector(".btnwake");
  if (d.sleeping) {
    st.className = "st off";
    st.textContent = "休眠中(" + (d.sleep_reason || "无观众") + ")";
    if (wake) wake.style.display = "inline-block";
  } else {
    st.className = "st" + (d.online ? "" : " off");
    st.textContent = (d.online ? "" : "离线 ") + d.width + "x" + d.height + " @" + d.fps + "fps " + d.bitrate;
    if (wake) wake.style.display = "none";
  }
}
function soloMode(card) {
  document.querySelectorAll(".cam").forEach(function(c){ c.classList.remove("show"); });
  document.body.classList.add("single");
  card.classList.add("show");
  document.getElementById("backbtn").style.display = "block";
}
function exitSolo() {
  document.body.classList.remove("single");
  document.querySelectorAll(".cam").forEach(function(c){ c.classList.remove("show"); });
  document.getElementById("backbtn").style.display = "none";
}
document.getElementById("backbtn").onclick = exitSolo;
document.addEventListener("fullscreenchange", function(){
  if (!document.fullscreenElement && document.body.classList.contains("single")) exitSolo();
});
// 浏览器后台标签页会挂起静音视频: 页面回到前台/窗口聚焦时自动恢复
function resumeAll() {
  Object.keys(PLAYERS).forEach(function(id){
    var p = PLAYERS[id];
    if (!p || !p.card) return;
    var v = p.card.querySelector("video");
    if (!v) return;
    if (v.paused) {
      p.start();
      refreshCam(id);
    }
  });
}
document.addEventListener("visibilitychange", function(){
  if (!document.hidden) resumeAll();
});
window.addEventListener("focus", function(){ resumeAll(); });
var PSTATE = {printing:"打印中", paused:"已暂停", complete:"已完成", standby:"待机", error:"错误", cancel:"已取消", starting:"启动中"};
function toggleCfg(card) {
  var rows = [card.querySelector(".cfgrow"), card.querySelector(".ptzrow"), card.querySelector(".ctrlrow")];
  var show = card.dataset.cfg !== "1";
  card.dataset.cfg = show ? "1" : "0";
  rows.forEach(function(r){ if (r) r.style.display = show ? (r._flex ? "flex" : "block") : "none"; });
}
function collapseCfg(card) {
  var rows = [card.querySelector(".cfgrow"), card.querySelector(".ptzrow"), card.querySelector(".ctrlrow")];
  rows.forEach(function(r){
    if (!r) return;
    r._flex = r.style.display === "flex";
    r.style.display = "none";
  });
  card.dataset.cfg = "0";
}
function fmtDur(ts) {
  if (!ts) return "";
  var s = Math.max(0, Math.round(ts - Date.now()/1000));
  var h = Math.floor(s/3600), m = Math.floor(s%3600/60);
  return (h>0 ? h+"h " : "") + m + "m";
}
function fmtT(v){ return v == null ? "-" : Math.round(v); }
function refreshPrinter(id) {
  var card = document.getElementById("cam_" + id);
  if (!card) return;
  fetch("api/printer/" + id).then(r=>r.json()).then(function(d){
    var p = card.querySelector(".printer");
    if (d.error || !d.state) { p.style.display = "none"; return; }
    p.style.display = "block";
    var st = p.querySelector(".pst");
    st.textContent = PSTATE[d.state] || d.state;
    st.className = "pst " + d.state;
    var txt = d.progress != null ? Math.round(d.progress*100) + "%" : "";
    if (d.total_layer) txt += " | " + (d.layer||0) + "/" + d.total_layer + " 层";
    var vt = p.parentElement.querySelector(".vtime");
    if (d.eta) {
      var rem = "剩 " + fmtDur(d.eta);
      txt += " " + rem;
      if (vt) { vt.textContent = rem; vt.style.display = "block"; }
    } else if (vt) {
      vt.style.display = "none";
    }
    if (d.ext_temp != null) {
      txt += " 喷头" + fmtT(d.ext_temp) + "/" + fmtT(d.ext_target) + "\u00b0";
    }
    p.querySelector(".pp").textContent = txt;
    p.querySelector(".pname").textContent = d.filename || "";
    p.querySelector(".pbar i").style.width = (d.progress!=null? Math.round(d.progress*100):0) + "%";
    var pb = p.querySelector(".pcmd.pause"), rb = p.querySelector(".pcmd.resume");
    if (pb && rb) {
      pb.style.display = d.state === "printing" ? "" : "none";
      rb.style.display = d.state === "paused" ? "" : "none";
      pb.onclick = function(){ post("api/printer/" + id + "/cmd", {cmd:"pause"}).then(function(r){ if(r.error) alert("暂停失败: "+r.error); }); };
      rb.onclick = function(){ post("api/printer/" + id + "/cmd", {cmd:"resume"}).then(function(r){ if(r.error) alert("继续失败: "+r.error); }); };
    }
  }).catch(function(){});
}
function refreshCam(id) {
  fetch("api/cam/" + id).then(r=>r.json()).then(function(d){
    if (d.error) return;
    var card = document.getElementById("cam_" + id);
    if (!card) return;
    setStatus(card, d);
    if (d.ptz) {
      var row = card.querySelector(".ptzrow");
      row.querySelector(".st").textContent = "pan:" + d.ptz.pan_absolute + " tilt:" + d.ptz.tilt_absolute;
      window["_ptz_" + id] = d.ptz;
    }
  }).catch(function(){});
}
function init() {
  fetch("api/cams").then(r=>r.json()).then(function(cams){
    cams.forEach(function(cam){
      var card = buildCard(cam);
      setStatus(card, cam);
      card.querySelector(".btnwake").onclick = function(){
        var b = this; b.disabled = true;
        post("api/cam/" + cam.id + "/wake", {}).then(function(d){
          if (d.ok) { refreshCam(cam.id); PLAYERS[cam.id].start(); }
        }).finally(function(){ b.disabled = false; });
      };
      card.querySelector(".btnsets").onclick = function(){ toggleCfg(card); };
      post("api/cam/" + cam.id + "/wake", {}).catch(function(){});
      card.querySelector(".btnsolo").onclick = function(){ soloMode(card); };
      card.querySelector(".btnfs").onclick = function(){
        if (document.fullscreenElement) document.exitFullscreen();
        else if (card.requestFullscreen) card.requestFullscreen();
        else if (card.webkitRequestFullscreen) card.webkitRequestFullscreen();
      };
      PLAYERS[cam.id] = play(cam.id, card);
      fetch("api/cam/" + cam.id).then(r=>r.json()).then(function(d){
        if (d.error) return;
        buildConfig(cam.id, card, d);
        buildPtz(cam.id, card, d);
        buildControls(cam.id, card, d);
        collapseCfg(card);
        if ((d.mode || "h264") === "mjpeg") showMjpeg(cam.id, card);
      }).catch(function(){});
      setInterval(function(){ refreshCam(cam.id); }, 5000);
      refreshPrinter(cam.id);
      setInterval(function(){ refreshPrinter(cam.id); }, 5000);
    });
  }).catch(function(){});
}
init();
</script>
</body>
</html>
